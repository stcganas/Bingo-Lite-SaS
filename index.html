      // Global Monkey-patch on Node.prototype to prevent Google Translate, Safari/Chrome mobile translators and browser extensions from crashing React DOM reconciler
      (function() {
        if (typeof Node === 'function' && Node.prototype) {
          var origRemoveChild = Node.prototype.removeChild;
          Node.prototype.removeChild = function(child) {
            if (!child) return child;
            if (child.parentNode !== this) {
              if (child.parentNode && typeof child.parentNode.removeChild === 'function') {
                try { return child.parentNode.removeChild(child); } catch(e) {}
              }
              return child;
            }
            try {

            } catch(err) {
              if (child.parentNode && typeof child.parentNode.removeChild === 'function') {
                try { return child.parentNode.removeChild(child); } catch(e) {}
              }
              return child;
            }
          };

          var origInsertBefore = Node.prototype.insertBefore;
          Node.prototype.insertBefore = function(newNode, referenceNode) {
            if (!newNode) return newNode;
            if (referenceNode && referenceNode.parentNode !== this) {
              if (referenceNode.parentNode && typeof referenceNode.parentNode.insertBefore === 'function') {
                try { return referenceNode.parentNode.insertBefore(newNode, referenceNode); } catch(e) {}
              }
              try { return this.appendChild(newNode); } catch(e) { return newNode; }
            }
            try {
              return origInsertBefore.apply(this, arguments);
            } catch(err) {
              try { return this.appendChild(newNode); } catch(e) { return newNode; }
            }
          };

          var origReplaceChild = Node.prototype.replaceChild;
          Node.prototype.replaceChild = function(newChild, oldChild) {
            if (!newChild || !oldChild) return oldChild;
            if (oldChild.parentNode !== this) {

            }
            try {
              return origReplaceChild.apply(this, arguments);
            } catch(err) {
              try { return this.appendChild(newChild); } catch(e) { return newChild; }
            }
          };
        }
      })();

      const originalOnError = window.onerror;
      window.onerror = function (message, source, lineno, colno, error) {
        const msgStr = String(message || '');
        if (msgStr.includes('Script error.') || msgStr.includes('removeChild') || msgStr.includes('insertBefore') || msgStr.includes('NotFoundError')) {
          return true;
        }
        if (originalOnError) {
          return originalOnError(message, source, lineno, colno, error);
        }
        return false;
      };
      window.addEventListener('error', function(e) {
        const msgStr = String(e.message || '');
        if (msgStr.includes('Script error.') || msgStr.includes('removeChild') || msgStr.includes('insertBefore') || msgStr.includes('NotFoundError')) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, true);
